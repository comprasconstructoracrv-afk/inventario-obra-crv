{% extends "base.html" %}

{% block content %}

<div class="titulo-pagina-card">
    <div class="titulo-icono">📤</div>

    <div>
        <h1>Editar Movimiento</h1>
        <p>Modifique la información de la salida registrada.</p>
    </div>
</div>

<div class="formulario-card">

    <h2 class="titulo-seccion">
        Datos del movimiento
    </h2>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Producto</label>
                <select name="producto_id" id="producto_id" required>
                    {% for producto in productos %}
                    <option value="{{ producto.id }}"
                        {% if movimiento.producto_id == producto.id %}selected{% endif %}>
                        {{ producto.codigo }} - {{ producto.nombre }} | Stock: {{ producto.stock }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Bodega/Sede de Origen</label>
                <select name="obra_id" id="obra_id" class="form-control" data-bodega-actual="{{ movimiento.obra_id }}" required>
                    <option value="">Seleccione una bodega</option>
                    {% for b in bodegas %}
                        <option value="{{ b.id }}" data-nombre="{{ b.nombre }}" {% if movimiento.obra_id == b.id %}selected{% endif %}>
                            {{ b.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <div class="form-grid">

           <div class="form-group">
                <label>Destino</label>
                <select name="destino_id" class="form-control" required>
                    <option value="">Seleccione un destino</option>
                    {% for d in destinos %}
                        <option value="{{ d.id }}" {% if movimiento.destino_id == d.id %}selected{% endif %}>
                            {{ d.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                <input type="number"
                       step="0.01"
                       name="cantidad"
                       value="{{ movimiento.cantidad }}"
                       required>
            </div>

        </div>

        <div class="form-group">
            <label>Observaciones</label>
            <input type="text"
                   name="observaciones"
                   value="{{ movimiento.observaciones or '' }}">
        </div>

        <div class="alerta-info">
            📌 Al guardar cambios, verifique que la salida corresponda a la sede/ bodega y destino correctos.
        </div>

        <div class="acciones-formulario">
            <button type="submit" class="btn-guardar">
                💾 Guardar cambios
            </button>

            <a href="{{ url_for('movimientos.listar_movimientos') }}" class="btn-cancelar">
                Cancelar
            </a>
        </div>

    </form>

</div>

<style>
.titulo-pagina-card{
    background:#fff;
    border-radius:22px;
    padding:34px;
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.titulo-icono{
    width:78px;
    height:78px;
    border-radius:50%;
    background:#fee2e2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
}

.titulo-pagina-card h1{
    margin:0;
    font-size:34px;
    color:#0f172a;
}

.titulo-pagina-card p{
    margin-top:8px;
    color:#64748b;
}

.formulario-card{
    background:white;
    border-radius:22px;
    padding:34px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.titulo-seccion{
    color:#2563eb;
    font-size:24px;
    margin-bottom:26px;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    font-weight:700;
    margin-bottom:9px;
    color:#0f172a;
}

.form-group input,
.form-group select{
    width:100%;
    box-sizing:border-box;
    padding:15px 16px;
    border-radius:14px;
    border:1px solid #cbd5e1;
    background:#f8fafc;
    font-size:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.alerta-info{
    background:#fff7ed;
    border:1px solid #fdba74;
    color:#c2410c;
    padding:16px 18px;
    border-radius:14px;
    font-weight:700;
    margin-top:8px;
}

.acciones-formulario{
    display:flex;
    gap:15px;
    margin-top:26px;
}

.btn-guardar{
    background:#16a34a;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

.btn-cancelar{
    background:#0f172a;
    color:white;
    padding:14px 24px;
    border-radius:12px;
    font-weight:700;
    text-decoration:none;
}
</style>

<script>
    const existenciasData = JSON.parse('{{ existencias_json | safe }}');

    const productoSelect = document.getElementById("producto_id");
    const bodegaSelect = document.getElementById("obra_id");
    const bodegaActual = bodegaSelect.getAttribute("data-bodega-actual");

    // Guardar las opciones originales de bodegas
    const opcionesBodegas = Array.from(bodegaSelect.querySelectorAll("option")).filter(opt => opt.value !== "");

    function actualizarBodegas(bodegaSeleccionadaPreviamente) {
        const productoId = productoSelect.value;
        bodegaSelect.innerHTML = "";

        if (!productoId || !existenciasData[productoId]) {
            const defaultOpt = document.createElement("option");
            defaultOpt.value = "";
            defaultOpt.textContent = "Seleccione una bodega";
            bodegaSelect.appendChild(defaultOpt);
            return;
        }

        const bodegasDisponibles = existenciasData[productoId];

        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.textContent = "Seleccione una bodega";
        bodegaSelect.appendChild(defaultOpt);

        bodegasDisponibles.forEach(item => {
            const optOriginal = opcionesBodegas.find(o => o.value == item.obra_id);
            if (optOriginal) {
                const newOpt = document.createElement("option");
                newOpt.value = item.obra_id;

                let cantFormateada = Number.isInteger(item.cantidad) ? item.cantidad : item.cantidad.toString().replace('.', ',');
                newOpt.textContent = `${optOriginal.getAttribute("data-nombre")} (Disponible: ${cantFormateada})`;

                if (bodegaSeleccionadaPreviamente && item.obra_id == bodegaSeleccionadaPreviamente) {
                    newOpt.selected = true;
                }

                bodegaSelect.appendChild(newOpt);
            }
        });
    }

    // Cargar bodegas al iniciar la vista
    actualizarBodegas(bodegaActual);

    // Escuchar cambios al seleccionar otro producto
    productoSelect.addEventListener("change", function () {
        actualizarBodegas(null);
    });
</script>

{% endblock %}
