{% extends "base.html" %}

{% block content %}

<div class="titulo-pagina-card">
    <div class="titulo-icono">📤</div>

    <div>
        <h1>Editar Movimiento</h1>
        <p>Modifique la información de la salida registrada.</p>
    </div>
</div>

<div class="formulario-card">

    <h2 class="titulo-seccion">
        Datos del movimiento
    </h2>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Producto</label>
                <select name="producto_id" required>
                    {% for producto in productos %}
                    <option value="{{ producto.id }}"
                        {% if movimiento.producto_id == producto.id %}selected{% endif %}>
                        {{ producto.codigo }} - {{ producto.nombre }} | Stock: {{ producto.stock }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Bodega</label>
                <select name="obra_id" required>
                    {% for obra in obras %}
                    <option value="{{ obra.id }}"
                        {% if movimiento.obra_id == obra.id %}selected{% endif %}>
                        {{ obra.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Destino del material</label>
                <select name="destino_id" required>
                    {% for destino in destinos %}
                    <option value="{{ destino.id }}"
                        {% if movimiento.destino_id == destino.id %}selected{% endif %}>
                        {{ destino.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                <input type="number"
                       step="0.01"
                       name="cantidad"
                       value="{{ movimiento.cantidad }}"
                       required>
            </div>

        </div>

        <div class="form-group">
            <label>Observaciones</label>
            <input type="text"
                   name="observaciones"
                   value="{{ movimiento.observaciones or '' }}">
        </div>

        <div class="alerta-info">
            📌 Al guardar cambios, verifique que la salida corresponda a la bodega y destino correctos.
        </div>

        <div class="acciones-formulario">
            <button type="submit" class="btn-guardar">
                💾 Guardar cambios
            </button>

            <a href="{{ url_for('movimientos.listar_movimientos') }}" class="btn-cancelar">
                Cancelar
            </a>
        </div>

    </form>

</div>

<style>
.titulo-pagina-card{
    background:#fff;
    border-radius:22px;
    padding:34px;
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.titulo-icono{
    width:78px;
    height:78px;
    border-radius:50%;
    background:#fee2e2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
}

.titulo-pagina-card h1{
    margin:0;
    font-size:34px;
    color:#0f172a;
}

.titulo-pagina-card p{
    margin-top:8px;
    color:#64748b;
}

.formulario-card{
    background:white;
    border-radius:22px;
    padding:34px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.titulo-seccion{
    color:#2563eb;
    font-size:24px;
    margin-bottom:26px;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    font-weight:700;
    margin-bottom:9px;
    color:#0f172a;
}

.form-group input,
.form-group select{
    width:100%;
    box-sizing:border-box;
    padding:15px 16px;
    border-radius:14px;
    border:1px solid #cbd5e1;
    background:#f8fafc;
    font-size:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.alerta-info{
    background:#fff7ed;
    border:1px solid #fdba74;
    color:#c2410c;
    padding:16px 18px;
    border-radius:14px;
    font-weight:700;
    margin-top:8px;
}

.acciones-formulario{
    display:flex;
    gap:15px;
    margin-top:26px;
}

.btn-guardar{
    background:#16a34a;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

.btn-cancelar{
    background:#0f172a;
    color:white;
    padding:14px 24px;
    border-radius:12px;
    font-weight:700;
    text-decoration:none;
}
</style>

{% endblock %}
