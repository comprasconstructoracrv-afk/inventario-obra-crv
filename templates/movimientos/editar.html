{% extends "base.html" %}

{% block content %}
<h1>Editar Movimiento</h1>

<div class="card">
    <form method="POST">
        <label>Producto</label>
        <select name="producto_id" required>
            {% for p in productos %}
            <option value="{{ p.id }}" {% if movimiento.producto_id == p.id %}selected{% endif %}>
                {{ p.nombre }} - Stock total: {{ p.stock }}
            </option>
            {% endfor %}
        </select>

        <label>Bodega</label>
        <select name="obra_id" required>
            {% for b in bodegas %}
            <option value="{{ b.id }}" {% if movimiento.obra_id == b.id %}selected{% endif %}>
                {{ b.nombre }}
            </option>
            {% endfor %}
        </select>

        <label>Tipo de movimiento</label>
        <select name="tipo" required>
            <option value="INGRESO" {% if movimiento.tipo == "INGRESO" %}selected{% endif %}>INGRESO A BODEGA</option>
            <option value="SALIDA" {% if movimiento.tipo == "SALIDA" %}selected{% endif %}>SALIDA / DESPACHO A OBRA</option>
        </select>

        <label>Cantidad</label>
        <input type="number" step="0.01" name="cantidad" value="{{ movimiento.cantidad }}" required>

        <label>Destino del material</label>
        <input type="text" name="destino" value="{{ movimiento.destino }}" placeholder="Ej: Casa 12, Portería, Vía principal">

        <label>Observaciones</label>
        <input type="text" name="observaciones" value="{{ movimiento.observaciones }}" placeholder="Ej: entregado a maestro">

        <br><br>
        <button type="submit">Guardar cambios</button>
    </form>
</div>
{% endblock %}
