{% extends "base.html" %}

{% block content %}

<style>
.traslado-page-title{
    background:white;
    border-radius:22px;
    padding:34px;
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.traslado-page-title .icono{
    width:78px;
    height:78px;
    border-radius:50%;
    background:#dbeafe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
}

.traslado-page-title h1{
    margin:0;
    font-size:36px;
    color:#0f172a;
}

.traslado-page-title p{
    margin-top:8px;
    color:#64748b;
    font-size:16px;
}

.formulario-card{
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.formulario-card h3{
    color:#2563eb;
    font-size:22px;
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:26px;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    margin-bottom:9px;
    font-weight:700;
    color:#0f172a;
}

.formulario-card input,
.formulario-card select{
    width:100%;
    box-sizing:border-box;
    padding:15px 16px;
    border-radius:14px;
    border:1px solid #cbd5e1;
    background:#f8fafc;
    font-size:15px;
}

.formulario-card input:focus,
.formulario-card select:focus{
    outline:none;
    border-color:#2563eb;
    background:white;
    box-shadow:0 0 0 4px rgba(37,99,235,0.12);
}

.alerta-info{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1d4ed8;
    padding:18px;
    border-radius:16px;
    font-weight:700;
    margin-top:10px;
}

.acciones-formulario{
    display:flex;
    gap:15px;
    margin-top:25px;
}

.btn-guardar{
    background:#2563eb;
    color:white;
    border:none;
    padding:16px 28px;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-cancelar{
    background:#0f172a;
    color:white;
    padding:16px 28px;
    border-radius:14px;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:1000px){
    .form-grid{
        grid-template-columns:1fr;
    }
}
</style>

<div class="header-actions no-print">
    <button onclick="window.history.back()" class="btn btn-dark">
        Volver
    </button>
</div>

<div class="traslado-page-title">
    <div class="icono">🔄</div>

    <div>
        <h1>Traslado Interno</h1>
        <p>Movimiento de material entre bodegas del inventario.</p>
    </div>
</div>

<form method="POST">

    <div class="formulario-card">

        <h3>Datos del traslado</h3>

        <div class="form-group">
            <label>Producto</label>

            <select name="producto_id" id="producto_id" required>
                <option value="">Seleccione un producto</option>

                {% for p in productos %}
                    <option value="{{ p.id }}">
                        {{ p.nombre }} - Stock total: {{ p.stock }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Bodega origen</label>

                <select name="bodega_origen_id" id="bodega_origen_id" required>
                    <option value="">Seleccione producto primero</option>
                </select>
            </div>

            <div class="form-group">
                <label>Bodega destino</label>

                <select name="bodega_destino_id" id="bodega_destino_id" required>
                    <option value="">Seleccione bodega destino</option>

                    {% for b in bodegas %}
                        <option value="{{ b.id }}">{{ b.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <div class="form-group">
            <label>Cantidad</label>

            <input
                type="number"
                step="0.01"
                name="cantidad"
                placeholder="Ingrese la cantidad a trasladar"
                required
            >
        </div>

        <div class="form-group">
            <label>Observación</label>

            <input
                type="text"
                name="observacion"
                placeholder="Ej: reorganización interna, cambio de ubicación, traslado a bodega auxiliar"
            >
        </div>

        <div class="alerta-info">
            🔄 Este movimiento descuenta de la bodega origen y suma automáticamente a la bodega destino.
        </div>

        <div class="acciones-formulario">

            <button type="submit" class="btn-guardar">
                💾 Guardar traslado interno
            </button>

            <a href="/existencias" class="btn-cancelar">
                Cancelar
            </a>

        </div>

    </div>

</form>

<script>
const existencias = [
{% for e in existencias %}
    {% if e.obra and e.cantidad > 0 %}
    {
        producto_id: {{ e.producto_id }},
        bodega_id: {{ e.obra_id }},
        bodega_nombre: {{ e.obra.nombre|tojson }},
        cantidad: {{ e.cantidad }}
    },
    {% endif %}
{% endfor %}
];

document.addEventListener("DOMContentLoaded", function() {
    const productoSelect = document.getElementById("producto_id");
    const origenSelect = document.getElementById("bodega_origen_id");

    productoSelect.addEventListener("change", function() {
        const productoId = parseInt(this.value);

        origenSelect.innerHTML = "";

        const opcionInicial = document.createElement("option");
        opcionInicial.value = "";
        opcionInicial.textContent = "Seleccione bodega origen";
        origenSelect.appendChild(opcionInicial);

        existencias.forEach(function(item) {
            if (item.producto_id === productoId && item.cantidad > 0) {
                const option = document.createElement("option");
                option.value = item.bodega_id;
                option.textContent = item.bodega_nombre + " (Disponible: " + item.cantidad + ")";
                origenSelect.appendChild(option);
            }
        });
    });
});
</script>

{% endblock %}
