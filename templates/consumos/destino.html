{% extends "base.html" %}

{% block content %}

<style>
.consumo-page-title{
    background:white;
    border-radius:22px;
    padding:34px;
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.consumo-page-title .icono{
    width:78px;
    height:78px;
    border-radius:50%;
    background:#dbeafe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
}

.consumo-page-title h1{
    margin:0;
    font-size:36px;
    color:#0f172a;
}

.consumo-page-title p{
    margin-top:8px;
    color:#64748b;
    font-size:16px;
}

.consulta-card{
    background:white;
    border-radius:22px;
    padding:34px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.consulta-card h3{
    color:#2563eb;
    font-size:22px;
    margin-bottom:25px;
}

.consulta-card label{
    display:block;
    margin-bottom:10px;
    font-weight:700;
    color:#0f172a;
}

.consulta-card select{
    width:100%;
    padding:15px 16px;
    border-radius:14px;
    border:1px solid #cbd5e1;
    background:#f8fafc;
    font-size:15px;
    margin-bottom:22px;
}

.consulta-card select:focus{
    outline:none;
    border-color:#2563eb;
    background:white;
    box-shadow:0 0 0 4px rgba(37,99,235,0.12);
}

.btn-consultar{
    background:#2563eb;
    color:white;
    border:none;
    padding:15px 26px;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
}
</style>

<div class="consumo-page-title">

    <div class="icono">🏠</div>

    <div>
        <h1>Consumo por Destino</h1>
        <p>Consulta materiales enviados a casas, zonas y frentes de obra.</p>
    </div>

</div>

<div class="consulta-card">

    <h3>Consultar destino</h3>

    <form id="formDestino">

        <label>Seleccione un destino</label>

        <select id="destino_id" required>
            <option value="">Seleccione...</option>

            {% for destino in destinos %}
            <option value="{{ destino.id }}">
                {{ destino.nombre }}
            </option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-consultar">
            Consultar Consumo
        </button>

    </form>

</div>

<script>
document.getElementById("formDestino").addEventListener("submit", function(e){
    e.preventDefault();

    let destino = document.getElementById("destino_id").value;

    if(destino){
        window.location.href = "/consumos/destino/" + destino;
    }
});
</script>

{% endblock %}
