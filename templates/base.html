<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OBRASTOCK</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .sidebar {
            width: 280px;
            height: 100vh;
            background: #111827;
            color: white;
            position: fixed;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
            color: #38bdf8;
        }

        .menu-title{
            color:white;
            text-align:center;
            font-size:28px;
            margin-bottom:35px;
            letter-spacing:2px;
            font-weight:800;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: #1f2937;
        }

        .content {
            margin-left: 300px;
            padding: 30px;
        }

        .topbar {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .topbar{
            background:white;
            padding:20px 25px;
            border-radius:18px;
            margin-bottom:30px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .topbar-left{
            display:flex;
            align-items:center;
            gap:20px;
        }

        .topbar-left img{
            width:80px;
            height:80px;
            object-fit:contain;
        }

        .topbar-left h1{
            margin:0;
            color:#0f172a;
            font-size:28px;
        }

        .topbar-left span{
            color:#64748b;
            font-size:14px;
        }

        .topbar-right{
            background:#111827;
            color:white;
            padding:10px 18px;
            border-radius:12px;
            font-weight:bold;
        }

        .card, .table-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            margin-bottom: 20px;
            padding: 20px;
        }

        .table-card {
            padding: 0;
        }

        table {
            background: white;
            border-collapse: collapse;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #111827;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: middle;
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button, .btn {
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-new {
            background: #0f766e;
        }

        .btn-excel {
            background: #16a34a;
        }

        .btn-pdf {
            background: #7c3aed;
        }

        .btn-print {
            background: #111827;
        }

        .btn-edit {
            background: #2563eb;
        }

        .btn-delete,
        .btn-danger {
            background: #dc2626;
        }

        .btn-success {
            background: #16a34a;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-dark {
            background: #111827;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .left-actions,
        .right-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .text-center {
            text-align: center;
        }

        .page-title {
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .page-subtitle {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .badge-success {
            background: #16a34a;
            color: white;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-danger {
            background: #dc2626;
            color: white;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-warning {
            background: #f59e0b;
            color: white;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        @media print {
            .sidebar,
            .topbar,
            .no-print {
                display: none !important;
            }

            .content {
                margin-left: 0;
                padding: 0;
            }

            body {
                background: white;
            }
        }

        .dashboard-grid{
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            gap:20px;
            margin-bottom:30px;
        }

        @media (max-width: 1100px) {
            .dashboard-grid{
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .dashboard-grid{
                grid-template-columns: 1fr;
            }
        }

        .kpi-card{
            border-radius:18px;
            padding:25px;
            color:white;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);
        }

        .kpi-card h3{
            margin:0;
            font-size:18px;
            opacity:0.9;
        }

        .kpi-card h1{
            margin-top:15px;
            font-size:42px;
        }

        .blue{
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
        }

        .green{
            background:linear-gradient(135deg,#16a34a,#15803d);
        }

        .orange{
            background:linear-gradient(135deg,#f59e0b,#d97706);
        }

        .red{
            background:linear-gradient(135deg,#dc2626,#b91c1c);
        }

        .dashboard-header{
            padding:20px;
        }

        .dashboard-header h2{
            margin:0;
            color:#111827;
        }

        .dashboard-header span{
            color:#6b7280;
        }

        .bodega-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: 22px;
        }

        .bodega-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .bodega-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .bodega-header h2 {
            margin: 0;
            color: #111827;
            font-size: 22px;
        }

        .bodega-header p {
            margin: 4px 0 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        .bodega-kpis {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .bodega-kpis div {
            background: #f3f4f6;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }

        .bodega-kpis strong {
            display: block;
            font-size: 24px;
            color: #111827;
        }

        .bodega-kpis span {
            color: #6b7280;
            font-size: 13px;
        }

        .categoria-box {
            border-top: 1px solid #e5e7eb;
            padding-top: 12px;
            margin-top: 12px;
        }

        .categoria-box h4 {
            margin: 0 0 10px 0;
            color: #0f766e;
            font-size: 15px;
        }

        .producto-linea {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dashed #e5e7eb;
            font-size: 14px;
        }

        .producto-linea span {
            color: #111827;
        }

        .producto-linea strong {
            color: #111827;
            white-space: nowrap;
        }

        .empty-box {
            background: #f9fafb;
            color: #6b7280;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
        }

        .bodega-actions {
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .page-header-card {
            background: white;
            border-radius: 18px;
            padding: 28px 30px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .page-header-card h1 {
            margin: 0;
            font-size: 34px;
            color: #0f172a;
        }

        .page-header-card p {
            margin-top: 8px;
            color: #64748b;
            font-size: 16px;
        }

        .ingreso-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 25px;
            align-items: start;
        }

        .info-producto-card,
        .form-ingreso-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .info-producto-card h3,
        .form-ingreso-card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #2563eb;
        }

        .info-row {
            background: #f8fafc;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #e5e7eb;
        }

        .info-row span {
            display: block;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .info-row strong {
            color: #0f172a;
            font-size: 20px;
        }

        .stock-card {
            margin-top: 22px;
            background: #dcfce7;
            color: #166534;
            border-radius: 16px;
            padding: 20px;
        }

        .stock-card span {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stock-card strong {
            font-size: 26px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .alert-info {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            padding: 14px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 600;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        @media (max-width: 900px) {
            .ingreso-layout {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .form-grid div{
            display:flex;
            flex-direction:column;
        }

        .form-ingreso-card input,
        .form-ingreso-card select{
            margin-top:8px;
            margin-bottom:18px;
        }

        label{
            margin-bottom:5px;
        }

        .page-title-card{
            background:white;
            border-radius:22px;
            padding:35px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:20px;
            margin-bottom:25px;
            box-shadow:0 4px 18px rgba(0,0,0,0.08);
        }

        .page-title-card h1{
            margin:0;
            color:#0f172a;
            font-size:52px;
        }

        .page-title-card p{
            margin-top:8px;
            color:#64748b;
            font-size:20px;
        }

        .title-icon{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#dbeafe;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
        }

        .ingreso-grid{
            display:grid;
            grid-template-columns:340px minmax(0, 1fr);
            gap:25px;
            margin-top:20px;
        }

        .producto-info-card,
        .formulario-card{
            background:white;
            border-radius:22px;
            padding:28px;
            box-shadow:0 4px 18px rgba(0,0,0,0.08);
        }

        .producto-info-card h3,
        .formulario-card h3{
            color:#2563eb;
            margin-bottom:22px;
            font-size:26px;
        }

        .producto-item{
            background:#f8fafc;
            border:1px solid #e2e8f0;
            border-radius:16px;
            padding:18px;
            margin-bottom:16px;
        }

        .producto-item span{
            display:block;
            color:#64748b;
            font-size:14px;
            margin-bottom:6px;
        }

        .producto-item strong{
            font-size:28px;
            color:#0f172a;
        }

        .stock-total-card{
            margin-top:25px;
            background:#dcfce7;
            border-radius:18px;
            padding:25px;
            text-align:center;
        }

        .stock-total-card small{
            display:block;
            color:#166534;
            margin-bottom:10px;
            font-weight:600;
        }

        .stock-total-card h2{
            margin:0;
            font-size:42px;
            color:#166534;
        }

        .stock-total-card span{
            font-weight:bold;
            color:#166534;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:28px;
        }

        .formulario-card label{
            display:block;
            margin-top:18px;
            margin-bottom:8px;
            font-weight:600;
            color:#0f172a;
        }

        .formulario-card input,
        .formulario-card select{
            width:100%;
            padding:16px;
            border-radius:14px;
            border:1px solid #cbd5e1;
            background:#f8fafc;
            font-size:15px;
            box-sizing:border-box;
            max-width:100%;
        }

        .formulario-card input:focus,
        .formulario-card select:focus{
            outline:none;
            border-color:#2563eb;
            background:white;
            box-shadow:0 0 0 4px rgba(37,99,235,0.12);
        }

        .alerta-info{
            margin-top:25px;
            background:#fff7ed;
            border:1px solid #fdba74;
            color:#c2410c;
            padding:18px;
            border-radius:16px;
            font-weight:600;
        }

        .acciones-formulario{
            display:flex;
            gap:15px;
            margin-top:28px;
        }

        .btn-success-custom{
            background:#16a34a;
            color:white;
            border:none;
            padding:16px 24px;
            border-radius:14px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        .btn-dark-custom,
        .btn-cancelar{
            background:#0f172a;
            color:white;
            padding:14px 22px;
            border-radius:14px;
            text-decoration:none;
            border:none;
            font-weight:bold;
            cursor:pointer;
        }

        @media(max-width:1000px){

            .ingreso-grid{
                grid-template-columns:1fr;
            }

            .form-grid{
                grid-template-columns:1fr;
            }

        }

        .print-only {
            display: none;
        }

        @media print {
            .no-print,
            .sidebar,
            .topbar,
            .app-header,
            .header-actions,
            .bodega-grid {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            .content {
                margin-left: 0 !important;
                padding: 20px !important;
            }

            body {
                background: white !important;
            }

            .print-only h2 {
                text-align: center;
                margin-bottom: 25px;
                font-size: 20px;
            }

            .print-only table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }

            .print-only th {
                background: #111827 !important;
                color: white !important;
                padding: 8px;
                border: 1px solid #111827;
            }

            .print-only td {
                padding: 8px;
                border: 1px solid #ddd;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2 class="menu-title">MENÚ</h2>
        <a href="/dashboard">Inicio</a>
        <a href="/existencias">Ver Inventario</a>
        <a href="/obras">Bodegas</a>
        <a href="/productos">Productos</a>
        <a href="/movimientos">Salidas de Material</a>
        <a href="/destinos">Destinos</a>
        <a href="/traslados/nuevo">Traslados internos</a>
        <a href="/historial-producto">Historial Producto</a>
        <a href="/consumos/destino">Consumo por Destino</a>
        <a href="/logout">Cerrar sesión</a>
    </div>

    <div class="content">
        <div class="topbar">
            
            <div class="topbar-left">
                <img src="{{ url_for('static', filename='logo.png') }}">
                
                <div>
                    <h1>INVENTARIO DE OBRA CRV</h1>
                    <span>Sistema Profesional de Control de Inventarios</span>
                </div>
            </div>

            <div class="topbar-right">
                {{ current_user.nombre }}
            </div>

        </div>

        {% block content %}{% endblock %}
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
function confirmarEliminar(event, mensaje) {
    event.preventDefault();

    const url = event.currentTarget.href;

    Swal.fire({
        title: '¿Confirmar eliminación?',
        text: mensaje,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sí, eliminar',
        cancelButtonText: 'Cancelar',
        background: '#ffffff',
        borderRadius: '15px'
    }).then((result) => {
        if (result.isConfirmed) {
            window.location.href = url;
        }
    });

    return false;
}
</script>

</body>
</html>
